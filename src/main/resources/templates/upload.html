<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">

<div layout:fragment="content">
    <div class="card">
        <form id="uploadForm" enctype="multipart/form-data">
            <input type="file" id="fileInput" style="display: none;">
            <div id="uploadArea" class="upload-area">
                <div class="upload-icon">
                    <i class="fas fa-cloud-upload-alt"></i>
                </div>
                <h3>Drag & Drop Files Here</h3>
                <p class="upload-text">Or click to select files</p>

                <div class="storage-options" style="margin-top: 1rem; padding: 0.5rem; background-color: rgba(255, 255, 255, 0.1); border-radius: 4px; display: inline-block;">
                    <label style="margin-right: 1rem;">
                        <input type="radio" name="storageType" value="local" checked>
                        <i class="fas fa-server"></i> Local Storage
                    </label>
                    <label>
                        <input type="radio" name="storageType" value="cloud">
                        <i class="fas fa-cloud"></i> Cloud Storage
                    </label>
                </div>
            </div>

            <div id="progressContainer" style="display: none;">
                <div class="form-group">
                    <h4>Upload Progress</h4>
                    <div class="progress">
                        <div id="progressBar" class="progress-bar" role="progressbar"></div>
                    </div>
                    <div style="display: flex; justify-content: space-between;">
                        <span id="progressText">0%</span>
                        <span id="uploadSpeed">0 B/s</span>
                    </div>
                </div>
            </div>

            <div id="successMessage" class="alert alert-success" style="display: none;">
                <h4><i class="fas fa-check-circle"></i> Upload Successful!</h4>
                <p id="uploadTimeInfo"></p>
                <p>Redirecting to file list ...</p>
            </div>
        </form>
    </div>
</div>
<div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2>Your Files</h2>
        <a href="/api/files/list" class="btn btn-secondary">
            <i class="fas fa-list"></i> View All Files
        </a>
    </div>
</div>
<th:block layout:fragment="scripts">
    <script th:src="@{/js/upload.js}"></script>
</th:block>
