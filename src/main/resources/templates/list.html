<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<body>
<div layout:fragment="content">
    <div class="card">
        <div class="card-body">
            <div th:if="${files != null and !files.isEmpty}">
                <ul class="file-list">
                    <li th:each="file : ${files}" class="file-item" th:data-id="${file.id}">
                        <div class="file-icon">
                            <i class="fas fa-file"></i>
                        </div>

                        <div class="file-info">
                            <div class="file-name" th:text="${file.originalFilename}">filename.txt</div>
                            <div class="file-meta">
                                <span class="file-size" th:text="${file.size}">1024</span> •
                                <span class="file-date" th:text="${file.uploadTime}">2023-01-01</span>
                            </div>
                        </div>

                        <div class="file-actions">
                            <a th:href="@{'/download/' + ${file.id}}" class="btn btn-secondary" title="Download">
                                <i class="fas fa-download"></i>
                            </a>

                            <a th:href="@{'/edit/' + ${file.id}}" class="btn btn-secondary" title="View/Edit">
                                <i class="fas fa-eye"></i>
                            </a>

                            <button class="btn btn-secondary edit-file"
                                    th:data-id="${file.id}"
                                    th:data-name="${file.originalFilename}"
                                    title="Rename">
                                <i class="fas fa-edit"></i>
                            </button>

                            <button class="btn btn-danger delete-file"
                                    th:data-id="${file.id}"
                                    th:data-name="${file.originalFilename}"
                                    title="Delete">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </li>
                </ul>
            </div>

            <div th:if="${files == null or files.isEmpty}" class="alert alert-info">
                <p>No files have been uploaded yet. <a href="/upload">Upload your first file</a>.</p>
            </div>
        </div>
    </div>
</div>

<!-- Page-specific scripts -->
<th:block layout:fragment="scripts">
    <script>
        // Page-specific JavaScript can go here
        document.addEventListener('DOMContentLoaded', function() {
            // Your existing list.js code
        });
    </script>
</th:block>
</body>
</html>
