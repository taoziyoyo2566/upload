<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/main.css">
    <style>
        .player-container {
            background-color: #1a1a1a;
            border-radius: var(--border-radius);
            padding: 1rem;
            margin-top: 1rem;
        }

        video, audio {
            width: 100%;
            border-radius: calc(var(--border-radius) - 4px);
        }

        .audio-player {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }

        .audio-icon {
            font-size: 7rem;
            color: var(--primary-color);
            margin-bottom: 2rem;
        }

        .file-info {
            text-align: center;
            margin-bottom: 1rem;
        }

        .plyr {
            border-radius: var(--border-radius);
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Media Player</h1>
        <p>Play your media files</p>
    </div>

    <div class="card">
        <div class="file-actions">
            <div>
                <h2 th:text="${file.originalFilename}">filename.mp3</h2>
                <div class="file-meta">
                    <span class="file-size" th:text="${file.size}">1024</span> •
                    <span class="file-date" th:text="${file.uploadTime}">2023-01-01</span>
                </div>
            </div>

            <div>
                <a th:href="@{'/api/files/' + ${file.id}}" class="btn btn-secondary">
                    <i class="fas fa-download"></i> Download
                </a>
                <a th:href="@{'/api/files/list'}" class="btn btn-secondary">
                    <i class="fas fa-list"></i> Back to List
                </a>
            </div>
        </div>

        <div class="player-container">
            <!-- Check if it's a video file -->
            <div th:if="${file.contentType != null && file.contentType.startsWith('video/')}">
                <video controls autoplay>
                    <source th:src="@{'/api/editor/stream/' + ${file.id}}" th:type="${file.contentType}">
                    Your browser does not support the video tag.
                </video>
            </div>

            <!-- Check if it's an audio file -->
            <div th:if="${file.contentType != null && file.contentType.startsWith('audio/')}" class="audio-player">
                <div class="audio-icon">
                    <i class="fas fa-music"></i>
                </div>
                <div class="file-info">
                    <h3 th:text="${file.originalFilename}">audio.mp3</h3>
                </div>
                <audio controls autoplay>
                    <source th:src="@{'/api/editor/stream/' + ${file.id}}" th:type="${file.contentType}">
                    Your browser does not support the audio element.
                </audio>
            </div>
        </div>
    </div>
</div>

<script src="/js/main.js"></script>
</body>
</html>
