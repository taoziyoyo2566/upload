<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/player.css">
</head>
<div layout:fragment="content">

    <div class="card">


        <div class="player-container">
            <!-- Check if it's a video file -->
            <div th:if="${file.contentType != null && file.contentType.startsWith('video/')}">
                <video controls autoplay>
                    <source th:src="@{'/api/editor/stream/' + ${file.id}}" th:type="${file.contentType}">
                    Your browser does not support the video tag.
                </video>
            </div>

            <!-- Check if it's an audio file -->
            <div th:if="${file.contentType != null && file.contentType.startsWith('audio/')}" class="audio-player">
                <div class="audio-icon">
                    <i class="fas fa-music"></i>
                </div>
                <div class="file-info">
                    <h3 th:text="${file.originalFilename}">audio.mp3</h3>
                </div>
                <audio controls autoplay>
                    <source th:src="@{'/api/editor/stream/' + ${file.id}}" th:type="${file.contentType}">
                    Your browser does not support the audio element.
                </audio>
            </div>
        </div>

        <div class="file-info-bar d-flex justify-content-between align-items-center flex-wrap mt-3 px-2">
            <div class="file-name text-truncate">
                <small th:text="${#strings.abbreviate(file.originalFilename, 120)}" class="text-muted"></small>
                <div class="file-meta text-muted">
                    <span class="file-size" th:text="${file.size}">1024</span> •
                    <span class="file-date" th:text="${file.uploadTime}">2023-01-01</span>
                </div>
            </div>
            <div class="file-buttons d-flex gap-2 mt-2 mt-sm-0">
                <a th:href="@{'/api/files/' + ${file.id}}" class="btn btn-sm btn-primary">
                    <i class="fas fa-download me-1"></i> Download
                </a>
                <a th:href="@{'/api/files/list'}" class="btn btn-sm btn-outline-secondary">
                    <i class="fas fa-list me-1"></i> Back to List
                </a>
            </div>
        </div>
    </div>
</div>
<th:block layout:fragment="scripts">
    <script th:src="@{/js/main.js}"></script>
</th:block>

</html>
